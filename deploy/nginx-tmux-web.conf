# /etc/nginx/sites-available/tmux-web
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP → HTTPS 로 이동 (단, CA 인증서 다운로드는 설치 전 기기를 위해 HTTP로도 제공)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location = /dev/ca.crt { proxy_pass http://127.0.0.1:8765; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # deploy/make-cert.sh 로 만든 자체 인증서
    ssl_certificate     /etc/nginx/ssl/tmux-web.crt;
    ssl_certificate_key /etc/nginx/ssl/tmux-web.key;

    location = / { return 302 /dev/; }

    location /dev {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1d;   # 터미널 WebSocket 장시간 유지
        proxy_send_timeout 1d;
        client_max_body_size 200m;  # 파일 올리기
    }
}
